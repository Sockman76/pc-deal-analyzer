name: Update PCDeal Retail Database
on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * *"
permissions:
  contents: write
jobs:
  retail-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate
        run: |
          python scripts/build_retail_db.py --master master-db --cc retail-import/canada-computers.json --amazon retail-import/amazon-ca.json --out retail-db
          python scripts/validate_retail_db.py retail-db
      - name: Commit
        run: |
          git config user.name "pcdeal-retail-bot"
          git config user.email "actions@users.noreply.github.com"
          git add retail-db
          if git diff --cached --quiet; then echo "No retail changes."; else git commit -m "Update PCDeal Canadian retail DB"; git push; fi
